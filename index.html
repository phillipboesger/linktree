<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <link
      rel="shortcut icon"
      href="assets/images/boesger-digital.png"
      type="image/webp"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/images/boesger-digital.png"
    />
    <link
      rel="icon"
      href="assets/images/boesger-digital.png"
      type="image/webp"
    />
    <title>Phillip Bösger</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <canvas id="network-canvas"></canvas>

    <div class="page">
      <header class="brand-header">
        <img
          src="assets/images/boesger-digital.png"
          alt="Bösger Digital"
          class="brand-logo"
        />
      </header>

        <main class="card-shell">
            <!-- Profile -->
            <div class="profile">
                <div class="avatar-ring">
                    <div class="avatar-clip">
                        <img src="assets/images/about-image.jpeg" alt="Phillip Bösger" class="avatar">
                    </div>
                </div>
                <h1 class="profile-name">Phillip Bösger</h1>
                <p class="profile-tagline">MORE AI, LESS MANUAL WORK.</p>
            </div>

        <!-- Links -->
        <nav class="links">
          <p class="section-label">Business</p>

          <a
            href="https://digital.boesger.com"
            target="_blank"
            rel="noopener"
            class="link-card"
          >
            <img src="assets/images/boesger-digital.png" alt="Bösger Digital" />
            <span>Bösger Digital</span>
            <svg
              class="arrow"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M7 17L17 7M17 7H7M17 7v10" />
            </svg>
          </a>

          <a
            href="https://polarion.boesger.com"
            target="_blank"
            rel="noopener"
            class="link-card"
          >
            <img src="assets/images/polarion.png" alt="Polarion Blog" />
            <span>Polarion Blog</span>
            <svg
              class="arrow"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M7 17L17 7M17 7H7M17 7v10" />
            </svg>
          </a>

          <a
            href="https://www.linkedin.com/in/phillip-boesger-90691215a/"
            target="_blank"
            rel="noopener"
            class="link-card"
          >
            <img src="assets/images/linkedin.png" alt="LinkedIn" />
            <span>LinkedIn</span>
            <svg
              class="arrow"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M7 17L17 7M17 7H7M17 7v10" />
            </svg>
          </a>

          <a
            href="https://github.com/phillipboesger"
            target="_blank"
            rel="noopener"
            class="link-card"
          >
            <img src="assets/images/github.png" alt="GitHub" />
            <span>GitHub</span>
            <svg
              class="arrow"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M7 17L17 7M17 7H7M17 7v10" />
            </svg>
          </a>

          <p class="section-label">Privat</p>

          <a
            href="https://photography.boesger.com"
            target="_blank"
            rel="noopener"
            class="link-card"
          >
            <img
              src="assets/images/logo_photography.png"
              alt="Bösger Photography"
            />
            <span>Bösger Photography</span>
            <svg
              class="arrow"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M7 17L17 7M17 7H7M17 7v10" />
            </svg>
          </a>

          <a
            href="https://www.instagram.com/phillip.bo/"
            target="_blank"
            rel="noopener"
            class="link-card"
          >
            <img src="assets/images/instagram.png" alt="Instagram" />
            <span>Instagram</span>
            <svg
              class="arrow"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M7 17L17 7M17 7H7M17 7v10" />
            </svg>
          </a>

          <p class="section-label">Automation</p>

          <a
            href="https://n8n.boesger.com"
            target="_blank"
            rel="nofollow noopener"
            class="link-card"
          >
            <img src="assets/images/n8n.png" alt="n8n" />
            <span>n8n</span>
            <svg
              class="arrow"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M7 17L17 7M17 7H7M17 7v10" />
            </svg>
          </a>

          <a
            href="http://proxmox.boesger.com"
            target="_blank"
            rel="nofollow noopener"
            class="link-card"
          >
            <img src="assets/images/proxmox-light.png" alt="Proxmox" />
            <span>Proxmox</span>
            <svg
              class="arrow"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M7 17L17 7M17 7H7M17 7v10" />
            </svg>
          </a>
        </nav>
      </main>

      <footer class="page-footer">
        <p>
          © <span id="footer-year"></span> Phillip Bösger &middot;
          <span class="footer-brand">Bösger Digital</span>
        </p>
      </footer>
    </div>

    <script src="assets/js/network.js"></script>
    <script>document.getElementById('footer-year').textContent = new Date().getFullYear();</script>
  </body>
</html>
