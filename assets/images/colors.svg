<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip">
      <circle cx="32" cy="32" r="27"/>
    </clipPath>
  </defs>

  <!-- Dark background -->
  <circle cx="32" cy="32" r="32" fill="#020c18"/>
  <circle cx="32" cy="32" r="30" fill="#041624"/>

  <!-- Three color blobs — clipped to inner circle -->
  <g clip-path="url(#clip)" filter="url(#bloom)">
    <!-- Cyan — top -->
    <circle cx="32" cy="24" r="15" fill="rgba(0,215,255,0.72)"/>
    <!-- Magenta — bottom-left -->
    <circle cx="23" cy="39" r="15" fill="rgba(255,35,140,0.72)"/>
    <!-- Amber — bottom-right -->
    <circle cx="41" cy="39" r="15" fill="rgba(255,185,0,0.72)"/>
  </g>

  <!-- Subtle cyan border ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="rgba(0,212,255,0.28)" stroke-width="1"/>
</svg>
